[project]
name = "decay-project"
version = "0.1.0"
description = "Estimate a radioisotope half-life from decay counts."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pre-commit>=3.5", "ruff>=0.8"]

[tool.pytest.ini_options]
# Puts the repo root on sys.path so `from decay_lab import ...` works
# from tests/ without installing the package. Requires pytest >= 7.0.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errors, pyflakes, import sort, pyupgrade, bugbear
ignore = ["E501"]                      # line length handled by the formatter
